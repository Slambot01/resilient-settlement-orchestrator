# ─────────────────────────────────────────────────────────────────────────────
# Horizontal Pod Autoscaler - Scales pods based on CPU/memory
# ─────────────────────────────────────────────────────────────────────────────
# Scales between 2-10 replicas based on resource utilization.
# Payment workloads are bursty (webhook floods), so HPA is essential.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: payment-orchestrator
  namespace: payment-system
  labels:
    app: payment-orchestrator
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: payment-orchestrator
  minReplicas: 2   # Always at least 2 for HA
  maxReplicas: 10  # Scale up during webhook floods
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70 # Scale up when avg CPU > 70%
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80 # Scale up when avg memory > 80%
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30  # React quickly to webhook bursts
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60 # Add up to 2 pods per minute
    scaleDown:
      stabilizationWindowSeconds: 300 # Wait 5 min before scaling down (avoid flapping)
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120 # Remove 1 pod every 2 minutes
