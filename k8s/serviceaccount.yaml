# ─────────────────────────────────────────────────────────────────────────────
# Kubernetes ServiceAccount - Bound to GCP SA via Workload Identity
# ─────────────────────────────────────────────────────────────────────────────
# The annotation tells GKE to impersonate the GCP service account,
# giving pods access to Pub/Sub, Secret Manager, Cloud SQL, etc.
# without any JSON key files.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-app
  namespace: payment-system
  annotations:
    # Workload Identity: map this K8s SA to the GCP SA
    # Replace PROJECT_ID with your actual GCP project ID
    iam.gke.io/gcp-service-account: payment-orchestrator-app@PROJECT_ID.iam.gserviceaccount.com
  labels:
    app: payment-orchestrator
