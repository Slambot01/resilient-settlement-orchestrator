# ─────────────────────────────────────────────────────────────────────────────
# ExternalSecret - Syncs GCP Secret Manager secrets to K8s Secrets
# ─────────────────────────────────────────────────────────────────────────────
# Uses the External Secrets Operator (ESO) to pull secrets from
# GCP Secret Manager and create Kubernetes Secret objects.
# The app reads these as environment variables via envFrom.
#
# Prerequisites:
#   helm install external-secrets external-secrets/external-secrets \
#     --namespace external-secrets --create-namespace
#
# Replace PROJECT_ID with your actual GCP project ID.

# ── SecretStore - Tells ESO how to connect to GCP Secret Manager ──────────
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: gcp-secret-store
  namespace: payment-system
spec:
  provider:
    gcpsm:
      projectID: PROJECT_ID
---
# ── ExternalSecret - Maps GCP secrets to K8s Secret keys ──────────────────
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: payment-app-secrets
  namespace: payment-system
  labels:
    app: payment-orchestrator
spec:
  refreshInterval: 1h # Re-sync secrets every hour
  secretStoreRef:
    name: gcp-secret-store
    kind: SecretStore
  target:
    name: payment-app-secrets # K8s Secret name
    creationPolicy: Owner
  data:
    # Database
    - secretKey: DB_PASSWORD
      remoteRef:
        key: payment-orchestrator-production-db-password
    - secretKey: REDIS_HOST
      remoteRef:
        key: payment-orchestrator-production-redis-host
    # API Authentication
    - secretKey: API_KEYS
      remoteRef:
        key: payment-orchestrator-production-api-keys
    # Stripe
    - secretKey: STRIPE_SECRET_KEY
      remoteRef:
        key: payment-orchestrator-production-stripe-secret-key
    - secretKey: STRIPE_WEBHOOK_SECRET
      remoteRef:
        key: payment-orchestrator-production-stripe-webhook-secret
    # Razorpay
    - secretKey: RAZORPAY_KEY_ID
      remoteRef:
        key: payment-orchestrator-production-razorpay-key-id
    - secretKey: RAZORPAY_KEY_SECRET
      remoteRef:
        key: payment-orchestrator-production-razorpay-key-secret
