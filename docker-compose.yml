# ============================================================================
# DEVELOPMENT ONLY — DO NOT use this file for staging or production.
# For production, use Kubernetes manifests with secrets from GCP Secret Manager.
# ============================================================================

services:
  app:
    build: .
    container_name: payment_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Override only what's needed for Docker networking
      - SERVER_ENV=development
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
      - PUBSUB_PROJECT_ID=local-dev
      - PUBSUB_ENABLED=true
      # OpenTelemetry tracing → Jaeger
      - TRACING_ENABLED=true
      - TRACING_ENDPOINT=http://jaeger:4318
      - TRACING_SAMPLE_RATE=1.0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pubsub-emulator:
        condition: service_started
      jaeger:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: payment_postgres
    restart: unless-stopped
    # V-023: Bind to localhost only — prevents external access to DB
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      # V-021: Credentials loaded from .env file, not hardcoded
      POSTGRES_USER: ${DB_USER:-payment_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-payment_secret}
      POSTGRES_DB: ${DB_NAME:-payment_orchestrator}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-payment_user} -d ${DB_NAME:-payment_orchestrator}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: payment_redis
    restart: unless-stopped
    # V-023: Bind to localhost only — prevents external access to Redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    container_name: payment_pubsub
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085
    ports:
      - "127.0.0.1:8085:8085"

  # ── Observability Stack ──────────────────────────────────────────

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    container_name: payment_jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"   # Jaeger UI
      - "4318:4318"     # OTLP HTTP receiver
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  prometheus:
    image: prom/prometheus:v3.4.1
    container_name: payment_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - app

  grafana:
    image: grafana/grafana:11.6.0
    container_name: payment_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  pgdata:
  redisdata:
  prometheus_data:
  grafana_data:
