version: "3.9"

services:
  app:
    build: .
    container_name: payment_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_ENV=development
      - SERVER_PORT=8080
      - DB_URL=postgres://payment_user:payment_secret@postgres:5432/payment_orchestrator?sslmode=disable
      - REDIS_URL=redis:6379
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-""}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-""}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-""}
      - DASHBOARD_USERNAME=admin
      - DASHBOARD_PASSWORD=admin
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: payment_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: payment_secret
      POSTGRES_DB: payment_orchestrator
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_user -d payment_orchestrator"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: payment_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
