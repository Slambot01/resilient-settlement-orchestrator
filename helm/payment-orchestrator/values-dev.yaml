# ─────────────────────────────────────────────────────────────────────────────
# values-dev.yaml — Development / Local environment overrides
# ─────────────────────────────────────────────────────────────────────────────
# Usage: helm install payment-dev ./helm/payment-orchestrator -f helm/payment-orchestrator/values-dev.yaml

replicaCount: 1

image:
  repository: payment-orchestrator
  tag: "dev"
  pullPolicy: Never  # Use locally built image (minikube/kind)

gcp:
  projectId: "dev-project"
  region: "us-central1"
  cloudSqlInstance: ""

# Disable cloud-specific features for local dev
cloudSqlProxy:
  enabled: false

ingress:
  enabled: false

autoscaling:
  enabled: false

pdb:
  enabled: false

networkPolicy:
  enabled: false

externalSecrets:
  enabled: false

# Smaller resource footprint for local
resources:
  app:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

# Local tracing (Jaeger in same cluster)
tracing:
  enabled: true
  endpoint: "http://jaeger:4318"
  sampleRate: "1.0"

# Local database (not via Cloud SQL Proxy)
env:
  SERVER_ENV: "development"
  SERVER_PORT: "8080"
  METRICS_PORT: "9091"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_USER: "payment_user"
  DB_NAME: "payment_orchestrator"
  DB_SSL_MODE: "disable"
  DB_MAX_CONNS: "10"
  DB_MIN_CONNS: "2"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  PUBSUB_ENABLED: "false"
  LOG_LEVEL: "debug"
  LOG_FORMAT: "json"
