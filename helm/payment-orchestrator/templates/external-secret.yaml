# ─────────────────────────────────────────────────────────────────────────────
# ExternalSecret — Syncs GCP Secret Manager → K8s Secrets
# ─────────────────────────────────────────────────────────────────────────────
{{- if .Values.externalSecrets.enabled }}
# SecretStore — tells ESO how to connect to GCP Secret Manager
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: {{ include "payment-orchestrator.fullname" . }}-gcp
  namespace: {{ include "payment-orchestrator.namespace" . }}
  labels:
    {{- include "payment-orchestrator.labels" . | nindent 4 }}
spec:
  provider:
    gcpsm:
      projectID: {{ .Values.gcp.projectId | quote }}
---
# ExternalSecret — maps GCP secrets to K8s Secret keys
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "payment-orchestrator.fullname" . }}-secrets
  namespace: {{ include "payment-orchestrator.namespace" . }}
  labels:
    {{- include "payment-orchestrator.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ include "payment-orchestrator.fullname" . }}-gcp
    kind: SecretStore
  target:
    name: {{ include "payment-orchestrator.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    {{- range .Values.externalSecrets.secrets }}
    - secretKey: {{ .key }}
      remoteRef:
        key: {{ .remoteKey }}
    {{- end }}
{{- end }}
