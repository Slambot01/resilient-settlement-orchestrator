# ─────────────────────────────────────────────────────────────────────────────
# NetworkPolicy — Restrict pod-to-pod communication
# ─────────────────────────────────────────────────────────────────────────────
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "payment-orchestrator.fullname" . }}
  namespace: {{ include "payment-orchestrator.namespace" . }}
  labels:
    {{- include "payment-orchestrator.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "payment-orchestrator.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Allow traffic from load balancer and health checks
    - ports:
        - port: {{ .Values.service.targetPort }}
          protocol: TCP
    # Allow Prometheus to scrape metrics
    - ports:
        - port: {{ .Values.service.metricsPort }}
          protocol: TCP

  egress:
    # DNS resolution (kube-dns)
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

    # Cloud SQL Proxy (sidecar on localhost)
    - ports:
        - port: 5432
          protocol: TCP

    # Redis (Memorystore private IP)
    - ports:
        - port: 6379
          protocol: TCP

    # HTTPS outbound (Stripe API, Razorpay API, Google APIs)
    - ports:
        - port: 443
          protocol: TCP

    # HTTP outbound (webhook callbacks)
    - ports:
        - port: 80
          protocol: TCP

    # OTLP/HTTP to Jaeger/OTel Collector
    {{- if .Values.tracing.enabled }}
    - ports:
        - port: 4318
          protocol: TCP
    {{- end }}
{{- end }}
