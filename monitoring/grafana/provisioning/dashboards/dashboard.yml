# Tells Grafana to load dashboards from the provisioned folder.
apiVersion: 1

providers:
  - name: 'Payment Orchestrator'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
