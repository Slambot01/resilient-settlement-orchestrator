# Prometheus configuration for the Payment Orchestrator.
# Scrapes the internal metrics port (9091) which has no auth —
# the public API port (8080) keeps its API key protection.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'payment-orchestrator'
    static_configs:
      - targets: ['app:9091']
    metrics_path: '/metrics'
    scrape_interval: 10s
